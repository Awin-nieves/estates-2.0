[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estates"
version = "0.1.0"
description = "Análisis de vigas continuas por el método de rigidez directa"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["estates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
